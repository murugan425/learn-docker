services:
  app:
    build: .
    image: channel-py-api:latest 
    container_name: channel-api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-include * 
    ports:
      - 8080:8000
    volumes:
      - .:/app
    networks:
      - channel-api-nw
      
networks:
  channel-api-nw:
    driver: bridge
    name: channel-api-net